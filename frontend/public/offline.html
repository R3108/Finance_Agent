<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Ledgerly</title>
<style>
  :root { --page: #f6f6f3; --ink: #0b0b0b; --muted: #52514e; --accent: #2a78d6; }
  @media (prefers-color-scheme: dark) { :root { --page: #0d0d0d; --ink: #fff; --muted: #c3c2b7; --accent: #3987e5; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--page); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
  main { max-width: 360px; text-align: center; }
  .mark { width: 48px; height: 48px; border-radius: 12px; background: var(--accent); color: #fff; display: grid; place-items: center;
          font-weight: 700; font-size: 24px; margin: 0 auto 16px; }
  p { color: var(--muted); }
  button { margin-top: 12px; padding: 10px 18px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<main>
  <div class="mark">L</div>
  <h1 style="font-size: 20px; margin: 0 0 6px">You're offline</h1>
  <p>Ledgerly only shows live figures, so it waits for a connection rather than showing out-of-date balances.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
